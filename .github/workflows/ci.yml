name: CI

on:
  push:
    # Avoid duplicate builds on PRs.
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "3.3.9"
      - name: Run StandardRB
        run: bundle exec standardrb
      - name: Run ShellCheck bin top level
        run: |
            # All bash files that don't end in '.rb'
            # https://git-scm.com/docs/gitglossary#Documentation/gitglossary.txt-aiddefpathspecapathspec
            git ls-files -z --cached --others --exclude-standard ':(exclude)*.rb' 'bin/*' '*/bin/*' '*.sh' | \
              xargs -0 shellcheck --check-sourced --color=always

  integration-test:
      runs-on: ubuntu-24.04
      env:
        HATCHET_APP_LIMIT: 300
        HATCHET_EXPENSIVE_MODE: 1
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_API_USER: ${{ secrets.HEROKU_API_USER }}
        RAILS_LTS_CREDS: ${{ secrets.RAILS_LTS_CREDS }}
        HEROKU_DISABLE_AUTOUPDATE: 1
        PARALLEL_SPLIT_TEST_PROCESSES: 85
        RSPEC_RETRY_RETRY_COUNT: 1
      steps:
        - name: Explain skipped integration tests
          if: ${{ env.HEROKU_API_KEY == '' || env.HEROKU_API_USER == '' }}
          run: echo '::notice::Skipping Hatchet integration tests because Heroku credentials are not configured; upstream runs this suite.'
        - name: Checkout
          if: ${{ env.HEROKU_API_KEY != '' && env.HEROKU_API_USER != '' }}
          uses: actions/checkout@v6
        - name: Install Ruby and dependencies
          if: ${{ env.HEROKU_API_KEY != '' && env.HEROKU_API_USER != '' }}
          uses: ruby/setup-ruby@v1
          with:
            bundler-cache: true
            ruby-version: "3.3.9"
        - name: Hatchet setup
          if: ${{ env.HEROKU_API_KEY != '' && env.HEROKU_API_USER != '' }}
          run: bundle exec hatchet ci:setup
        - name: Run Hatchet integration tests
          if: ${{ env.HEROKU_API_KEY != '' && env.HEROKU_API_USER != '' }}
          # parallel_split_test runs rspec in parallel, with concurrency equal to PARALLEL_SPLIT_TEST_PROCESSES.
          run: bundle exec parallel_split_test spec/
